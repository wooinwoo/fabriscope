name: Deploy

# main에 들어온 커밋이 CI를 통과하면 Cloudflare Pages(fabriscope)에 웹과 API Worker를 함께 배포한다.
# 배포 토큰은 Pages·Workers 쓰기 권한만 가진 전용 토큰이며 production environment에만 둔다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # CI가 성공했고, 외부 fork가 아닌 이 저장소의 push에서 시작된 경우만 배포한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web and API worker
        run: pnpm --filter @sensor-mes/web run build:cloudflare

      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: >-
          npx --yes wrangler@4.158.0 pages deploy dist
          --project-name fabriscope --branch main --no-bundle
          --commit-hash "$COMMIT_SHA"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://fabriscope.wooki.cc/api/health || echo "000")
          echo "health -> HTTP $code"
          test "$code" = "200"
