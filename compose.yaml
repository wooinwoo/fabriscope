name: fabriscope

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fabriscope}
      POSTGRES_USER: ${POSTGRES_USER:-fabriscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabriscope_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-fabriscope} -d ${POSTGRES_DB:-fabriscope}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
